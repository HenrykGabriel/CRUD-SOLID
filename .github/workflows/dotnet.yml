
name: Compilar projeto C#

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar projeto
        run: dotnet build --configuration Release --no-restore

      - name: Publicar executável Windows
        run: dotnet publish --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true --output ./publish

      - name: Disponibilizar EXE para download
        uses: actions/upload-artifact@v4
        with:
          name: projeto-csharp-exe
          path: publish/*.exe
          retention-days: 30
